<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Directory</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #f43f5e;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .form-card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 0.6rem;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .add-btn-wrapper {
            display: flex;
            align-items: flex-end;
        }

        .artist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .artist-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .artist-card h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .handle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .genre {
            font-size: 0.85rem;
            color: var(--accent);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .tag {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .sample-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .sample-grid img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            background-color: var(--bg-color);
        }

        .no-samples {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem;
            margin-top: auto;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .delete-btn:hover {
            background-color: rgba(244, 63, 94, 0.1);
            opacity: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Artist Directory</h1>
        <p>Multi-source index with integrated API fetch handling</p>
    </header>

    <div class="container">
        <!-- Input Form Panel -->
        <div class="form-card">
            <div class="form-group">
                <label for="input-name">Artist Name / Tag</label>
                <input type="text" id="input-name" placeholder="e.g. brikot">
            </div>
            <div class="form-group">
                <label for="input-handle">Twitter / Source Handle</label>
                <input type="text" id="input-handle" placeholder="e.g. brikot_art">
            </div>
            <div class="form-group">
                <label for="input-genre">Genre / Category</label>
                <select id="input-genre">
                    <option value="normal">Normal</option>
                    <option value="alternative">Alternative</option>
                    <option value="sketch">Sketch</option>
                </select>
            </div>
            <div class="form-group">
                <label for="input-tags">Tags (Comma separated)</label>
                <input type="text" id="input-tags" placeholder="tits, thighs, solo">
            </div>
            <div class="add-btn-wrapper">
                <button onclick="handleAddNewArtist()" id="submit-btn" style="width: 100%;">Add & Fetch</button>
            </div>
        </div>

        <!-- Dynamic Grid Container -->
        <div id="artist-grid" class="artist-grid"></div>
    </div>

    <script>
        const STORAGE_KEY = "artist_directory_db_v1";

        const defaultArtists = [
            {
                name: "Brikot",
                twitterHandle: "brikot_art",
                genre: "normal",
                tags: ["tits", "thighs", "creampie", "sweat", "stockings"],
                samples: []
            }
        ];

        function getDb() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                saveDb(defaultArtists);
                return [...defaultArtists];
            }
            try {
                return JSON.parse(data);
            } catch (e) {
                console.error("Failed to parse storage, resetting database.", e);
                saveDb(defaultArtists);
                return [...defaultArtists];
            }
        }

        function saveDb(db) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }

        async function fetchArtistData(artistName) {
            const formattedTag = artistName.trim().toLowerCase().replace(/\s+/g, "_");
            const targetUrl = `https://rule34.xxx/index.php?page=dapi&s=post&q=index&json=1&tags=${encodeURIComponent(formattedTag)}`;
            const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const posts = await response.json();
                
                if (!Array.isArray(posts) || posts.length === 0) {
                    console.warn(`No posts returned for artist: ${artistName}`);
                    return [];
                }

                return posts
                    .map(p => p.preview_file_url || p.file_url || p.large_file_url)
                    .filter(Boolean);
            } catch (error) {
                console.error(`Failed to retrieve resources for ${artistName}:`, error);
                return [];
            }
        }

        async function handleAddNewArtist() {
            const nameInput = document.getElementById("input-name");
            const handleInput = document.getElementById("input-handle");
            const genreInput = document.getElementById("input-genre");
            const tagsInput = document.getElementById("input-tags");
            const submitBtn = document.getElementById("submit-btn");

            const name = nameInput.value.trim();
            if (!name) {
                alert("Please enter an artist name.");
                return;
            }

            submitBtn.textContent = "Fetching API...";
            submitBtn.disabled = true;

            const db = getDb();
            if (db.some(a => a.name.toLowerCase() === name.toLowerCase())) {
                alert("Artist already exists in the directory.");
                submitBtn.textContent = "Add & Fetch";
                submitBtn.disabled = false;
                return;
            }

            const tags = tagsInput.value.split(",").map(t => t.trim()).filter(Boolean);
            const samples = await fetchArtistData(name);

            const newArtist = {
                name,
                twitterHandle: handleInput.value.trim(),
                genre: genreInput.value,
                tags,
                samples
            };

            db.unshift(newArtist);
            saveDb(db);
            renderDirectory();

            // Reset inputs
            nameInput.value = "";
            handleInput.value = "";
            tagsInput.value = "";
            submitBtn.textContent = "Add & Fetch";
            submitBtn.disabled = false;
        }

        function removeArtist(index) {
            const db = getDb();
            db.splice(index, 1);
            saveDb(db);
            renderDirectory();
        }

        function renderDirectory() {
            const db = getDb();
            const container = document.getElementById("artist-grid");
            
            if (!container) return;
            container.innerHTML = "";

            db.forEach((artist, index) => {
                const card = document.createElement("div");
                card.className = "artist-card";

                let samplesHtml = "";
                if (artist.samples && artist.samples.length > 0) {
                    samplesHtml = `<div class="sample-grid">
                        ${artist.samples.slice(0, 4).map(url => `<img src="${url}" alt="Sample artwork" loading="lazy" />`).join("")}
                    </div>`;
                } else {
                    samplesHtml = `<p class="no-samples">No image samples available or failed to load.</p>`;
                }

                card.innerHTML = `
                    <h3>${artist.name}</h3>
                    <p class="handle">@${artist.twitterHandle || "N/A"}</p>
                    <p class="genre">Genre: ${artist.genre}</p>
                    <div class="tags">
                        ${artist.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
                    </div>
                    ${samplesHtml}
                    <button onclick="removeArtist(${index})" class="delete-btn">Remove Artist</button>
                `;

                container.appendChild(card);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderDirectory();
        });
    </script>
</body>
</html>
