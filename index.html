<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Directory</title>
  <style>
    :root {
      --bg-dark: #0f0f13;
      --card-bg: #181820;
      --card-border: #262633;
      --accent: #e91e63;
      --accent-hover: #ff2a73;
      --text-main: #f0f0f8;
      --text-sub: #9090a8;
      --sidebar-width: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background-color: #121218;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.4rem;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .btn-admin {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-admin:hover { background: var(--accent-hover); }

    .search-container {
      display: flex;
      gap: 12px;
      padding: 16px 28px;
      background: var(--bg-dark);
      align-items: center;
    }

    .search-bar {
      flex: 1;
      padding: 11px 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
    }
    .search-bar:focus { outline: none; border-color: var(--accent); }

    .genre-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 9px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .genre-btn.active { background: var(--accent); border-color: var(--accent); }

    .main-wrapper {
      display: flex;
      flex: 1;
      padding: 0 28px 28px 28px;
      gap: 24px;
    }

    .content-area { flex: 1; }

    .stats-text {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      border: 2px solid var(--accent);
      background-color: #222;
    }

    .card h3 {
      font-size: 1.15rem;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .badge.normal { background: #1c2b38; color: #64b5f6; }
    .badge.furry { background: #381c2b; color: #f06292; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .tag {
      font-size: 0.72rem;
      background: #22222e;
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--text-sub);
    }
    .tag.more-count {
      background: rgba(233, 30, 99, 0.15);
      color: var(--accent);
      font-weight: 600;
    }

    .links-row {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-top: auto;
    }
    .links-row a {
      flex: 1;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 7px 4px;
      border-radius: 6px;
      background: #22222d;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .links-row a img.favicon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }
    .links-row a:hover {
      background: #2d2d3d;
      border-color: var(--accent);
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      height: fit-content;
      position: sticky;
      top: 80px;
    }
    .sidebar h2 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: var(--accent);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }
    .sidebar-tags {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .sidebar-tag-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 6px;
      background: #20202c;
      font-size: 0.82rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
    }
    .sidebar-tag-item:hover, .sidebar-tag-item.active {
      background: var(--accent);
      color: #fff;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .artist-modal-header {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .artist-modal-header img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .full-tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 100px;
      overflow-y: auto;
      padding: 8px;
      background: #121218;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    .samples-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
    }
    .samples-grid img {
      width: 100%;
      height: auto; /* Preserves the native aspect ratio */
      max-height: 600px; /* Gives large vertical space for high-res art */
      object-fit: contain; /* Ensures no part of the artwork is cropped out */
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background-color: #000;
    }

    .admin-artist-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
      background: #121218;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }
    .admin-artist-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 4px;
      background: #1a1a24;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .admin-artist-item:hover {
      background: var(--accent);
      color: #fff;
    }

    .modal-btn {
      padding: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background: var(--accent);
      color: white;
    }
    .modal-btn.secondary { background: #444; }
    .modal-btn.danger { background: #c62828; }
  </style>
</head>
<body>

  <header>
    <h1>NSFW Artist Directory</h1>
    <button class="btn-admin" onclick="openAdminModal()">+ Add/Edit Artist</button>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search artist or tag..." oninput="render()">
    <button class="genre-btn active" onclick="filterGenre('all', this)">All</button>
    <button class="genre-btn" onclick="filterGenre('normal', this)">Normal</button>
    <button class="genre-btn" onclick="filterGenre('furry', this)">Furry</button>
  </div>

  <div class="main-wrapper">
    <div class="content-area">
      <div class="stats-text" id="statsText">Loading...</div>
      <div class="grid" id="artistGrid"></div>
    </div>

    <div class="sidebar">
      <h2>Filter by Tag</h2>
      <div class="sidebar-tag-item active" id="clearTagBtn" onclick="selectTagFilter('')">
        <span>All Tags</span>
      </div>
      <div class="sidebar-tags" id="sidebarTags"></div>
    </div>
  </div>

  <!-- Artist Details Modal -->
  <div class="overlay" id="artistModal">
    <div class="modal">
      <div class="artist-modal-header">
        <img id="modalAvatar" referrerpolicy="no-referrer" src="" alt="" onerror="this.src='https://ui-avatars.com/api/?name=Artist&background=e91e63&color=fff'">
        <div>
          <h2 id="modalName"></h2>
          <span id="modalBadge" class="badge"></span>
          <div id="modalTwitterHandle" style="font-size:0.85rem; color:var(--text-sub);"></div>
        </div>
      </div>
      <div>
        <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px;">Featured Specialties:</p>
        <div class="tags" id="modalFeaturedTags" style="justify-content: flex-start;"></div>
      </div>
      <div>
        <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px;">All Indexed Tags:</p>
        <div class="full-tags-list" id="modalAllTags"></div>
      </div>
      <div>
        <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px;">Top Artwork Samples (via Danbooru):</p>
        <div class="samples-grid" id="modalSamples"></div>
      </div>
      <div class="links-row" id="modalLinks"></div>
      <button class="modal-btn secondary" onclick="closeModal('artistModal')">Close</button>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="overlay" id="adminModal">
    <div class="modal">
      <h2 id="adminTitle">Add or Edit Artist</h2>
      
      <p style="font-size: 0.8rem; color: var(--text-sub);">Click an artist to edit, or enter details below to add a new one:</p>
      <div class="admin-artist-list" id="adminArtistList"></div>

      <div id="adminStatus" style="font-size: 0.85rem; color: var(--accent);"></div>
      <input type="text" id="inputName" class="search-bar" placeholder="Artist Danbooru Tag (e.g. brikot)">
      <input type="text" id="inputTwitter" class="search-bar" placeholder="Twitter Handle (e.g. brikot_art)">
      <input type="text" id="inputFeatured" class="search-bar" placeholder="Featured Tags (Comma separated: tits, thighs)">
      
      <button class="modal-btn" onclick="processAddOrEditArtist()">Auto-Fetch via Danbooru & Save</button>

      <div style="display: flex; gap: 8px;">
        <button class="modal-btn danger" style="flex: 1; display: none;" id="btnDelete" onclick="deleteCurrentArtist()">Delete Artist</button>
        <button class="modal-btn secondary" style="flex: 1;" onclick="clearAdminForm()">Clear Form</button>
      </div>

      <button class="modal-btn" style="background:#2e7d32;" onclick="exportHtml()">📥 Export HTML to File</button>
      <button class="modal-btn secondary" onclick="closeModal('adminModal')">Cancel</button>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "admin";

    const ICONS = {
      twitter: "https://x.com/favicon.ico",
      rule34: "https://rule34.xxx/favicon.ico",
      e621: "https://e621.net/favicon.ico"
    };

    const defaultArtists = [
      {
        name: "Brikot",
        twitterHandle: "brikot_art",
        genre: "normal",
        featuredTags: ["tits", "thighs", "creampie"],
        tags: ["tits", "thighs", "creampie", "sweat", "stockings", "female", "solo", "uncensored", "high_res", "smiling"],
        samples: []
      }
    ];

    let currentGenre = 'all';
    let selectedSidebarTag = '';
    let editingOriginalName = null;

    function getDb() {
      const stored = localStorage.getItem('artist_db');
      if (stored) return JSON.parse(stored);
      localStorage.setItem('artist_db', JSON.stringify(defaultArtists));
      return defaultArtists;
    }

    // Fetches artwork automatically via Danbooru API (strictly lowercase tag string, limited to 4 images)
    async function fetchArtistData(artistName, twitterHandle, manualFeaturedTags) {
      let samples = [];
      let allTagsSet = new Set();
      let furryScore = 0;

      // Force lowercase to match Danbooru API requirements
      const cleanTag = artistName.toLowerCase().trim();

      try {
        const danbooruUrl = `https://danbooru.donmai.us/posts.json?tags=${encodeURIComponent(cleanTag)}&limit=4`;
        const res = await fetch(danbooruUrl);
        
        if (res.ok) {
          const posts = await res.json();
          if (Array.isArray(posts) && posts.length > 0) {
            samples = posts.map(p => p.preview_file_url || p.large_file_url || p.file_url).filter(Boolean);
            posts.forEach(p => {
              if (p.tag_string) {
                p.tag_string.split(' ').forEach(t => {
                  allTagsSet.add(t);
                  if (['furry', 'anthro', 'scalie', 'feral'].includes(t)) furryScore++;
                });
              }
            });
          }
        }
      } catch (e) {
        console.warn("Danbooru fetch warning:", e);
      }

      const allTagsArray = Array.from(allTagsSet);
      let featured = manualFeaturedTags
        ? manualFeaturedTags.split(",").map(t => t.trim().toLowerCase()).filter(Boolean)
        : allTagsArray.slice(0, 3);

      return {
        name: artistName,
        twitterHandle: (twitterHandle || '').replace('@', '').trim(),
        genre: furryScore >= 1 ? "furry" : "normal",
        featuredTags: featured,
        tags: allTagsArray.length > 0 ? allTagsArray : featured,
        samples: samples
      };
    }

    function buildLinksHtml(artist) {
      const twitterHandle = artist.twitterHandle;
      const twitterUrl = twitterHandle 
        ? `https://x.com/${twitterHandle}`
        : `https://x.com/search?q=${encodeURIComponent(artist.name)}`;

      const r34Url = `https://rule34.xxx/index.php?page=post&s=list&tags=${encodeURIComponent(artist.name.toLowerCase())}`;
      const e621Url = `https://e621.net/posts?tags=${encodeURIComponent(artist.name.toLowerCase())}`;

      const twitterBtn = `<a href="${twitterUrl}" target="_blank" onclick="event.stopPropagation()"><img src="${ICONS.twitter}" class="favicon" onerror="this.style.display='none'"> Twitter</a>`;
      const r34Btn = `<a href="${r34Url}" target="_blank" onclick="event.stopPropagation()"><img src="${ICONS.rule34}" class="favicon" onerror="this.style.display='none'"> Rule34</a>`;
      const e621Btn = `<a href="${e621Url}" target="_blank" onclick="event.stopPropagation()"><img src="${ICONS.e621}" class="favicon" onerror="this.style.display='none'"> e621</a>`;

      if (artist.genre === 'furry') {
        return `${twitterBtn}${e621Btn}${r34Btn}`;
      } else {
        return `${twitterBtn}${r34Btn}${e621Btn}`;
      }
    }

    function getAvatarUrl(artist) {
      if (artist.twitterHandle) {
        return `https://unavatar.io/x/${artist.twitterHandle}`;
      }
      if (artist.samples && artist.samples.length > 0) {
        return artist.samples[0];
      }
      return `https://ui-avatars.com/api/?name=${encodeURIComponent(artist.name)}&background=e91e63&color=fff`;
    }

    function renderSidebarTags(db) {
      const tagCounts = {};
      db.forEach(a => {
        (a.tags || []).forEach(f => {
          tagCounts[f] = (tagCounts[f] || 0) + 1;
        });
      });

      const container = document.getElementById('sidebarTags');
      container.innerHTML = '';

      Object.keys(tagCounts)
        .sort((a, b) => tagCounts[b] - tagCounts[a])
        .slice(0, 50)
        .forEach(tag => {
          const div = document.createElement('div');
          div.className = `sidebar-tag-item ${selectedSidebarTag === tag ? 'active' : ''}`;
          div.onclick = () => selectTagFilter(tag);
          div.innerHTML = `<span>#${tag}</span><span>${tagCounts[tag]}</span>`;
          container.appendChild(div);
        });
    }

    function selectTagFilter(tag) {
      selectedSidebarTag = tag;
      document.getElementById('clearTagBtn').className = `sidebar-tag-item ${tag === '' ? 'active' : ''}`;
      render();
    }

    function filterGenre(genre, btn) {
      currentGenre = genre;
      document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const db = getDb();
      renderSidebarTags(db);

      const grid = document.getElementById('artistGrid');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = db.filter(a => {
        const matchGenre = currentGenre === 'all' || a.genre === currentGenre;
        const matchTag = selectedSidebarTag === '' || (a.tags && a.tags.includes(selectedSidebarTag));
        const matchSearch = a.name.toLowerCase().includes(search) || 
                            (a.tags && a.tags.some(f => f.toLowerCase().includes(search)));
        return matchGenre && matchTag && matchSearch;
      });

      document.getElementById('statsText').innerText = `Showing ${filtered.length} of ${db.length} artists`;
      grid.innerHTML = '';

      filtered.forEach(artist => {
        const extraTagsCount = (artist.tags || []).length - (artist.featuredTags || []).length;
        const avatarUrl = getAvatarUrl(artist);
        const fallbackDanbooruAvatar = (artist.samples && artist.samples.length > 0) ? artist.samples[0] : `https://ui-avatars.com/api/?name=${encodeURIComponent(artist.name)}&background=e91e63&color=fff`;

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = (e) => {
          if (e.target.tagName !== 'A' && !e.target.closest('a')) openArtistModal(artist);
        };

        card.innerHTML = `
          <img class="card-avatar" referrerpolicy="no-referrer" src="${avatarUrl}" alt="${artist.name}" onerror="this.onerror=null; this.src='${fallbackDanbooruAvatar}';">
          <h3>${artist.name}</h3>
          <span class="badge ${artist.genre}">${artist.genre}</span>
          <div class="tags">
            ${(artist.featuredTags || []).map(f => `<span class="tag">${f}</span>`).join('')}
            ${extraTagsCount > 0 ? `<span class="tag more-count">+${extraTagsCount}</span>` : ''}
          </div>
          <div class="links-row">
            ${buildLinksHtml(artist)}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openArtistModal(artist) {
      const avatarUrl = getAvatarUrl(artist);
      const fallbackDanbooruAvatar = (artist.samples && artist.samples.length > 0) ? artist.samples[0] : `https://ui-avatars.com/api/?name=${encodeURIComponent(artist.name)}&background=e91e63&color=fff`;
      
      const modalAvatar = document.getElementById('modalAvatar');
      modalAvatar.src = avatarUrl;
      modalAvatar.onerror = () => { modalAvatar.src = fallbackDanbooruAvatar; };

      document.getElementById('modalName').innerText = artist.name;
      document.getElementById('modalTwitterHandle').innerText = artist.twitterHandle ? `@${artist.twitterHandle}` : 'No Twitter handle set';
      
      const badge = document.getElementById('modalBadge');
      badge.innerText = artist.genre;
      badge.className = `badge ${artist.genre}`;

      document.getElementById('modalFeaturedTags').innerHTML = (artist.featuredTags || []).map(f => `<span class="tag">${f}</span>`).join('');
      document.getElementById('modalAllTags').innerHTML = (artist.tags || []).map(f => `<span class="tag">${f}</span>`).join('');

      const samplesDiv = document.getElementById('modalSamples');
      if (artist.samples && artist.samples.length > 0) {
        samplesDiv.innerHTML = artist.samples.map(s => `<img referrerpolicy="no-referrer" src="${s}" alt="sample" onerror="this.style.display='none'">`).join('');
      } else {
        samplesDiv.innerHTML = '<p style="font-size:0.85rem; color:var(--text-sub); grid-column:span 2;">No image previews returned from Danbooru for this tag.</p>';
      }

      document.getElementById('modalLinks').innerHTML = buildLinksHtml(artist);
      document.getElementById('artistModal').style.display = 'flex';
    }

    function openAdminModal() {
      if (prompt("Enter Admin Password:") === ADMIN_PASS) {
        populateAdminArtistList();
        clearAdminForm();
        document.getElementById('adminModal').style.display = 'flex';
      }
    }

    function populateAdminArtistList() {
      const db = getDb();
      const listDiv = document.getElementById('adminArtistList');
      listDiv.innerHTML = '';

      db.forEach(artist => {
        const item = document.createElement('div');
        item.className = 'admin-artist-item';
        item.innerHTML = `<span><strong>${artist.name}</strong></span> <span>@${artist.twitterHandle || 'none'}</span>`;
        item.onclick = () => loadArtistIntoAdminForm(artist);
        listDiv.appendChild(item);
      });
    }

    function loadArtistIntoAdminForm(artist) {
      editingOriginalName = artist.name;
      document.getElementById('inputName').value = artist.name;
      document.getElementById('inputTwitter').value = artist.twitterHandle || '';
      document.getElementById('inputFeatured').value = (artist.featuredTags || []).join(', ');
      document.getElementById('adminStatus').innerText = `Editing: ${artist.name}`;
      document.getElementById('btnDelete').style.display = 'block';
    }

    function clearAdminForm() {
      editingOriginalName = null;
      document.getElementById('inputName').value = '';
      document.getElementById('inputTwitter').value = '';
      document.getElementById('inputFeatured').value = '';
      document.getElementById('adminStatus').innerText = '';
      document.getElementById('btnDelete').style.display = 'none';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    async function processAddOrEditArtist() {
      const name = document.getElementById('inputName').value.trim();
      const twitter = document.getElementById('inputTwitter').value.trim();
      const featured = document.getElementById('inputFeatured').value.trim();
      const status = document.getElementById('adminStatus');

      if (!name) return;
      status.innerText = "Querying Danbooru API...";

      const data = await fetchArtistData(name, twitter, featured);
      let db = getDb();

      if (editingOriginalName) {
        db = db.filter(a => a.name.toLowerCase() !== editingOriginalName.toLowerCase());
      } else {
        db = db.filter(a => a.name.toLowerCase() !== name.toLowerCase());
      }

      db.unshift(data);
      localStorage.setItem('artist_db', JSON.stringify(db));
      
      status.innerText = "Saved successfully!";
      setTimeout(() => { 
        closeModal('adminModal'); 
        render(); 
      }, 600);
    }

    function deleteCurrentArtist() {
      if (!editingOriginalName) return;
      if (confirm(`Are you sure you want to delete ${editingOriginalName}?`)) {
        let db = getDb().filter(a => a.name.toLowerCase() !== editingOriginalName.toLowerCase());
        localStorage.setItem('artist_db', JSON.stringify(db));
        closeModal('adminModal');
        render();
      }
    }

    function exportHtml() {
      const db = getDb();
      let code = document.documentElement.outerHTML;
      code = code.replace(/const defaultArtists = \[[\s\S]*?\];/, `const defaultArtists = ${JSON.stringify(db, null, 2)};`);
      const blob = new Blob(["<!DOCTYPE html>\n" + code], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }

    render();
  </script>
</body>
</html>
